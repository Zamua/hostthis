<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<meta name=color-scheme content="light dark">
<title>hostthis</title>
<link rel="stylesheet" href="/_hostthis/linegutter.css?v=__VER__">
<link rel="stylesheet" href="/_hostthis/log.css?v=__VER__">
<header id="bar">
  <div id="levels" role="group" aria-label="Filter by level"></div>
  <button id="togglefields" type="button" aria-pressed="true" title="show or hide the field list">Fields</button>
  <span class="grow"></span>
  <input id="q" type="search" placeholder="level=error status>=500 &quot;connection reset&quot;" autocomplete="off" spellcheck="false">
  <span id="meta" aria-live="polite"></span>
  <a id="dl" href="?raw=1">raw</a>
</header>
<div id="hist" hidden aria-label="Records over time"></div>
<div id="body">
  <aside id="fields" aria-label="Detected fields"></aside>
  <main id="log" aria-busy="true"></main>
</div>
