# Builds the production image (Dockerfile.slatedb) on a native amd64 runner and
# pushes it to ghcr. Exists because the operator box is arm64: the Rust uniffi
# stage under qemu emulation takes an hour and gets OOM-killed, while a native
# runner builds it in minutes. Trigger by hand with the git tag to build.
name: image
on:
  workflow_dispatch:
    inputs:
      tag:
        description: git tag to build and push (e.g. v1.6.0)
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      # GHCR_TOKEN, not GITHUB_TOKEN: the ghcr package predates this workflow
      # and is not linked to the repo, so the built-in token has no
      # write_package grant for it. The secret carries the same PAT the
      # operator box pushes with.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: zamua
          password: ${{ secrets.GHCR_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.slatedb
          platforms: linux/amd64
          push: true
          tags: ghcr.io/zamua/hostthis:${{ inputs.tag }}
