name: e2e report (PR)

# Runs the e2e suite for every pull request and keeps Playwright's HTML report
# as a build artifact. A PR labelled `e2e-report` also publishes it to hostthis
# at one URL a reviewer can open on a phone: results per browser, the
# screenshots the tests attach, and traces for failures. Runs the `e2e-ci` make
# target twice: reading from hostthisd, and with E2E_READS=worker from the
# Worker's public surface, whose report is published under /worker/. The site
# is deleted when the PR closes (e2e-report-cleanup.yml).
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

# A labeled event for any other label gets its own group, so it cannot cancel
# a run in progress for the same PR; its job is skipped below.
concurrency:
  group: e2e-report-${{ github.event.pull_request.number }}${{ github.event.action == 'labeled' && github.event.label.name != 'e2e-report' && '-ignored' || '' }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  report:
    # Adding the label runs the suite and publishes; any other label is ignored.
    if: github.event.action != 'labeled' || github.event.label.name == 'e2e-report'
    runs-on: ubuntu-latest
    # Playwright's own image holds the browsers and every system library they
    # need, so no run downloads them: `playwright install --with-deps` fetched
    # ~139 MB through apt on every run, and a slow Ubuntu mirror could take the
    # whole timeout. Its tag must match e2e/package.json's @playwright/test
    # (checked below). --ipc=host is what Playwright's docs ask for Chromium.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    timeout-minutes: 35
    # A container job's steps default to sh; the steps below use bash syntax.
    defaults:
      run:
        shell: bash
    env:
      # Job level, not step level: the secrets context is rejected in a step's
      # `if`, and a step's own env block is not visible to its own condition.
      # Runner logs mask the value.
      HOSTTHIS_SSH_KEY: ${{ secrets.HOSTTHIS_SSH_KEY }}
      PUBLISH: ${{ contains(github.event.pull_request.labels.*.name, 'e2e-report') }}

    steps:
      - uses: actions/checkout@v4

      # The checkout belongs to the runner's user and the container runs as
      # root, so git refuses the tree as dubiously owned unless told otherwise,
      # and `go build` fails reading its VCS status.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # A @playwright/test bump without the image would download browsers the
      # image lacks the libraries for; fail here, by name, instead.
      - name: Check the image matches @playwright/test
        run: |
          want=$(node -p "require('./e2e/package.json').devDependencies['@playwright/test']")
          grep -q "image: mcr.microsoft.com/playwright:v$want-" .github/workflows/e2e-pr.yml \
            || { echo "e2e/package.json pins @playwright/test $want; set the job's container image to playwright:v$want-noble"; exit 1; }

      # The image has no make, and the publish step reads JSON with jq. Only
      # noble's main index is fetched (~2 MB, both are in it), not every list
      # the image configures. Two mirrors, so one that does not resolve does
      # not fail the job: apt takes the index from whichever answers.
      - name: Install make and jq
        run: |
          printf 'deb http://%s/ubuntu noble main\n' archive.ubuntu.com azure.archive.ubuntu.com > /tmp/noble-main.list
          apt() { apt-get -o Dir::Etc::SourceList=/tmp/noble-main.list -o Dir::Etc::SourceParts=/dev/null "$@"; }
          apt update -qq
          apt install -y -qq --no-install-recommends make jq

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            e2e/package-lock.json
            worker/package-lock.json
            worker/localrt/package-lock.json

      # A failing suite is the case a report matters most for, so the result is
      # recorded here and the job is failed at the very end instead.
      - name: Run e2e
        id: tests
        continue-on-error: true
        run: make e2e-ci PLAYWRIGHT_DEPS=

      - name: Run e2e, Worker reads
        id: tests-worker
        continue-on-error: true
        env:
          E2E_READS: worker
        run: make e2e-ci PLAYWRIGHT_DEPS=

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-pr${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
            e2e/playwright-report-worker/
            e2e/test-results-worker/
          if-no-files-found: warn
          retention-days: 30

      # hostthis identifies an uploader by ssh key and refuses a keyless client,
      # so publishing needs HOSTTHIS_SSH_KEY. Without it, or without the
      # `e2e-report` label, this is skipped, not failed, and the report still
      # ships as a build artifact. Pull requests from forks never receive
      # secrets, so they skip too.
      - name: Publish report
        id: publish
        if: always() && env.PUBLISH == 'true' && env.HOSTTHIS_SSH_KEY != ''
        continue-on-error: true
        env:
          REPORT_NAME: "hostthis e2e PR #${{ github.event.pull_request.number }}"
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$HOSTTHIS_SSH_KEY" > ~/.ssh/hostthis
          chmod 600 ~/.ssh/hostthis
          hh() { ssh -T -i ~/.ssh/hostthis -o IdentitiesOnly=yes \
                     -o StrictHostKeyChecking=accept-new -o ConnectTimeout=40 "$@"; }

          # One slug per labelled pull request, redeployed in place: the URL in
          # the PR comment stays correct for the life of the branch and each
          # run becomes a new version rather than a new paste.
          slug=$(hh hostthis.dev list -o json 2>/dev/null \
                 | jq -r --arg n "$REPORT_NAME" 'map(select(.name==$n))[0].slug // ""' 2>/dev/null || true)
          echo "existing slug for '$REPORT_NAME': ${slug:-<none>}"

          if [ -d e2e/playwright-report-worker ]; then
            rm -rf e2e/playwright-report/worker
            cp -R e2e/playwright-report-worker e2e/playwright-report/worker
          fi

          # errexit is on by default here, so the pipeline must be shielded or
          # the step dies before any diagnostic below it runs. stderr is kept:
          # discarding it turns a real failure into a blank variable.
          set +e
          tar czf - -C e2e/playwright-report . | hh hostthis.dev $slug > upload.out 2> upload.err
          rc=$?
          set -e
          echo "ssh exit: $rc"
          echo "--- stdout ---"; head -c 500 upload.out || true
          echo "--- stderr ---"; head -c 500 upload.err || true

          url=$(grep -oE 'https://[a-z0-9]+\.hostthis\.dev' upload.out | head -1)
          if [ -z "$url" ]; then
            echo "upload produced no url"
            exit 1
          fi
          if [ -z "$slug" ]; then
            newslug=$(echo "$url" | sed -E 's|https://([a-z0-9]+)\..*|\1|')
            hh hostthis.dev rename "$newslug" "$REPORT_NAME" || true
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "published $url"

      - name: Comment the report link
        # Forks get a read-only token, so this cannot post there. The job
        # summary always carries the link.
        if: always() && steps.publish.outputs.url != '' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        # The image has no gh, so this posts through the REST API.
        run: |
          body="e2e ${{ steps.tests.outcome }}: ${{ steps.publish.outputs.url }}, Worker reads ${{ steps.tests-worker.outcome }}: ${{ steps.publish.outputs.url }}/worker/ (commit \`${GITHUB_SHA:0:8}\`)"
          jq -n --arg body "$body" '{body: $body}' | curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/${{ github.event.pull_request.number }}/comments" \
            --data @- > /dev/null

      - name: Summary
        if: always()
        run: |
          {
            echo "### e2e: ${{ steps.tests.outcome }}, Worker reads: ${{ steps.tests-worker.outcome }}"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| report | ${{ steps.publish.outputs.url || 'not published; label the PR e2e-report, or see the report artifact' }} |"
            echo "| commit | \`${GITHUB_SHA:0:8}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # The suite's own result decides the job, after the report exists.
      - name: Gate on the suite result
        if: always() && (steps.tests.outcome != 'success' || steps.tests-worker.outcome != 'success')
        run: |
          echo "e2e ${{ steps.tests.outcome }}, Worker reads ${{ steps.tests-worker.outcome }}; report: ${{ steps.publish.outputs.url }}"
          exit 1
