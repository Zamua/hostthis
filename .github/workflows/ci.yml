name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Formatting: every file must be gofmt-clean.
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "These files are not gofmt-clean (run 'gofmt -w .'):"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # Modernize check: in Go 1.26 'go fix' is the modernizer suite (same
      # analysis framework as vet). '-diff' prints pending modernizations
      # without applying; a non-empty diff means the tree has un-modernized
      # idioms. Run 'go fix ./...' locally and commit to satisfy this.
      - name: go fix (modernize check)
        run: |
          out=$(go fix -diff ./... 2>/dev/null)
          if [ -n "$out" ]; then
            echo "Pending modernizations (run 'go fix ./...' and commit):"
            echo "$out"
            exit 1
          fi

      - name: build
        run: go build ./...

      - name: test
        run: make test

  # The celld-gated suites run against `celld dev`, which uses the production
  # Worker runtime with a local persistent object store. A separate operator
  # gate qualifies object-store restore behavior against MinIO.
  celld:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: install pinned celld
        env:
          CELLD_ARCHIVE_SHA256: 0488628597154725db2f61f85434fb381e1b2535d1e9f097c6d20727cd337973
        run: |
          curl -fsSL https://github.com/denoland/celld/releases/download/v0.4.0/celld-x86_64-unknown-linux-gnu.gz \
            -o "$RUNNER_TEMP/celld.gz"
          printf '%s  %s\n' "$CELLD_ARCHIVE_SHA256" "$RUNNER_TEMP/celld.gz" | sha256sum -c -
          gunzip -c "$RUNNER_TEMP/celld.gz" > "$RUNNER_TEMP/celld"
          chmod +x "$RUNNER_TEMP/celld"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # A real node against MinIO, not `celld dev`: the dev watcher polls the
      # project directory, sees its own PROJECT/.celld state writes on Linux,
      # and restart-storms the application, dropping mid-suite connections.
      - name: celld storage and room contracts
        run: |
          docker run -d --name ci-minio -p 9000:9000 \
            -e MINIO_ROOT_USER=admin -e MINIO_ROOT_PASSWORD=supersecret \
            minio/minio:latest server /data
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null && break
            sleep 1
          done
          docker run --rm --network host --entrypoint sh minio/mc:latest -c \
            'mc alias set local http://127.0.0.1:9000 admin supersecret >/dev/null && mc mb local/ci-fleet'

          export AWS_ACCESS_KEY_ID=admin AWS_SECRET_ACCESS_KEY=supersecret
          celld deploy ./celld --bucket s3://ci-fleet --endpoint http://127.0.0.1:9000
          celld --bucket s3://ci-fleet --endpoint http://127.0.0.1:9000 \
            --listen 127.0.0.1:8087 >"$RUNNER_TEMP/celld-node.log" 2>&1 &
          celld_pid=$!
          trap 'kill "$celld_pid" 2>/dev/null || true' EXIT

          ready=false
          for _ in $(seq 1 60); do
            if ! kill -0 "$celld_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/celld-node.log"
              exit 1
            fi
            if curl -fsS http://127.0.0.1:8087/.well-known/celld/health >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat "$RUNNER_TEMP/celld-node.log"
            exit 1
          fi

          CELLD_TEST_ENDPOINT=http://127.0.0.1:8087 \
            go test -count=1 ./internal/storage -run 'TestConformance_Celld'
          CELLD_TEST_ENDPOINT=http://127.0.0.1:8087 \
            go test -count=1 ./internal/http -run 'TestLiveRoom'

      # The node's own log is the only diagnostic when it dies mid-suite,
      # which presents as connection-refused test noise.
      - name: celld node log
        if: always()
        run: tail -n 200 "$RUNNER_TEMP/celld-node.log" || true
