name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      # Formatting: every file must be gofmt-clean.
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "These files are not gofmt-clean (run 'gofmt -w .'):"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # Modernize check: in Go 1.26 'go fix' is the modernizer suite (same
      # analysis framework as vet). '-diff' prints pending modernizations
      # without applying; a non-empty diff means the tree has un-modernized
      # idioms. Run 'go fix ./...' locally and commit to satisfy this.
      - name: go fix (modernize check)
        run: |
          out=$(go fix -diff ./... 2>/dev/null)
          if [ -n "$out" ]; then
            echo "Pending modernizations (run 'go fix ./...' and commit):"
            echo "$out"
            exit 1
          fi

      - name: build
        run: go build ./...

      - name: test
        run: go test ./...

  # The celld-gated suites against a real fleet: MinIO + the celld runtime on
  # the runner, the worker deployed from this checkout. This is the job that
  # exercises the PRODUCTION metadata plane; the plain `go` job covers the
  # memory backend.
  celld:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: stand up the fleet
        run: ./scripts/ci-celld-up.sh

      - name: storage conformance (celld)
        run: CELLD_TEST_ENDPOINT=http://127.0.0.1:8087 go test -count=1 ./internal/storage -run 'TestConformance_Celld'

      - name: live room contract (handler -> proxy -> cell)
        run: CELLD_TEST_ENDPOINT=http://127.0.0.1:8087 go test -count=1 ./internal/http -run 'TestLiveRoom'
