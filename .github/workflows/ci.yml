name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      # Formatting: every file must be gofmt-clean.
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "These files are not gofmt-clean (run 'gofmt -w .'):"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # Modernize check: in Go 1.26 'go fix' is the modernizer suite (same
      # analysis framework as vet). '-diff' prints pending modernizations
      # without applying; a non-empty diff means the tree has un-modernized
      # idioms. Run 'go fix ./...' locally and commit to satisfy this.
      - name: go fix (modernize check)
        run: |
          out=$(go fix -diff ./... 2>/dev/null)
          if [ -n "$out" ]; then
            echo "Pending modernizations (run 'go fix ./...' and commit):"
            echo "$out"
            exit 1
          fi

      - name: build
        run: go build ./...

      - name: test
        run: go test ./...

  # The tag production actually runs. The default job above never compiles the
  # slatedb files, so a break there has no symptom until a deploy - which is how
  # a composition-root regression once shipped green.
  go-slatedb:
    runs-on: ubuntu-latest
    env:
      # Keep aligned with Dockerfile.slatedb's SLATEDB_VERSION and the
      # slatedb-go version pinned in go.mod.
      SLATEDB_VERSION: v0.15.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      # The cdylib is ~30 MB of Rust that changes only when SLATEDB_VERSION
      # does, so it is cached on that key rather than rebuilt every run.
      - name: cache libslatedb_uniffi
        id: slatedb-lib
        uses: actions/cache@v4
        with:
          path: prebuilt/libslatedb_uniffi.so
          key: libslatedb-uniffi-${{ env.SLATEDB_VERSION }}-${{ runner.os }}

      - name: build libslatedb_uniffi
        if: steps.slatedb-lib.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev cmake
          git clone --depth 1 --branch "$SLATEDB_VERSION" \
            https://github.com/slatedb/slatedb.git /tmp/slatedb
          cargo build --release --manifest-path /tmp/slatedb/Cargo.toml -p slatedb-uniffi
          mkdir -p prebuilt
          cp /tmp/slatedb/target/release/libslatedb_uniffi.so prebuilt/

      - name: stage the cdylib on the linker + loader path
        run: |
          sudo cp prebuilt/libslatedb_uniffi.so /usr/local/lib/
          sudo ldconfig

      - name: build
        run: go build -tags slatedb ./...
        env:
          CGO_ENABLED: '1'
          CGO_LDFLAGS: -L/usr/local/lib

      - name: vet
        run: go vet -tags slatedb ./...
        env:
          CGO_ENABLED: '1'
          CGO_LDFLAGS: -L/usr/local/lib

      # No MinIO service: the tests that need one skip on an unset
      # MINIO_TEST_ENDPOINT, so this covers everything that does not.
      - name: test
        run: go test -tags slatedb ./...
        env:
          CGO_ENABLED: '1'
          CGO_LDFLAGS: -L/usr/local/lib
          LD_LIBRARY_PATH: /usr/local/lib
