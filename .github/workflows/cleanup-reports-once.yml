name: cleanup reports (one-time, manual)

# Deletes a given list of published e2e report sites in one run, then is
# removed. Runs only on dispatch. The default is a dry run, which prints the
# targets and their size and deletes nothing.
on:
  workflow_dispatch:
    inputs:
      owner:
        description: "Owner id prefix (hex, 8+ chars) the key must report"
        required: true
      delete:
        description: "Space-separated slugs to delete"
        required: true
      keep:
        description: "Space-separated slugs that must never be deleted"
        required: true
      expect:
        description: "Number of slugs in delete (guards against a truncated list)"
        required: true
      dry_run:
        description: "List the targets only"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HOSTTHIS_SSH_KEY: ${{ secrets.HOSTTHIS_SSH_KEY }}
      # Inputs reach the script through the environment, never interpolated
      # into it.
      OWNER: ${{ inputs.owner }}
      DELETE: ${{ inputs.delete }}
      KEEP: ${{ inputs.keep }}
      EXPECT: ${{ inputs.expect }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Clean up
        run: |
          set -euo pipefail
          [ -n "$HOSTTHIS_SSH_KEY" ] || { echo "no HOSTTHIS_SSH_KEY"; exit 1; }
          [[ $OWNER =~ ^[0-9a-f]{8,}$ ]] || { echo "owner must be 8+ hex chars"; exit 1; }
          [[ $EXPECT =~ ^[0-9]+$ ]] || { echo "expect must be a number"; exit 1; }

          read -r -a del <<<"$DELETE"
          read -r -a keep <<<"$KEEP"
          [ "${#del[@]}" -eq "$EXPECT" ] || { echo "delete has ${#del[@]} slugs, expected $EXPECT"; exit 1; }
          [ "${#keep[@]}" -gt 0 ] || { echo "keep is empty"; exit 1; }
          for s in "${del[@]}" "${keep[@]}"; do
            [[ $s =~ ^[a-z0-9]{6,16}$ ]] || { echo "not a slug: $s"; exit 1; }
          done
          dups=$(printf '%s\n' "${del[@]}" | sort | uniq -d)
          [ -z "$dups" ] || { echo "duplicate slugs: $dups"; exit 1; }
          both=$(comm -12 <(printf '%s\n' "${del[@]}" | sort) <(printf '%s\n' "${keep[@]}" | sort))
          [ -z "$both" ] || { echo "in both delete and keep: $both"; exit 1; }

          install -m 700 -d ~/.ssh
          printf '%s\n' "$HOSTTHIS_SSH_KEY" > ~/.ssh/hostthis
          chmod 600 ~/.ssh/hostthis
          hh() { ssh -T -i ~/.ssh/hostthis -o IdentitiesOnly=yes \
                     -o StrictHostKeyChecking=accept-new -o ConnectTimeout=40 "$@"; }

          reading() { jq -c '{key: (.key[0:15] + "..."), active_pastes, used_bytes, quota_bytes}' <<<"$1"; }

          who=$(hh hostthis.dev whoami -o json)
          id=$(jq -r '.key | sub("^SHA256:"; "")' <<<"$who")
          echo "before: $(reading "$who")"

          list=$(hh hostthis.dev list -o json)
          jq -e 'type == "array"' <<<"$list" >/dev/null || { echo "unreadable listing"; exit 1; }
          if [[ $id != "$OWNER"* ]]; then
            echo "key is not owner $OWNER; aborting"
            echo "this key's sites: $(jq -c '{total: length, reports: ([.[] | select((.name // "") | startswith("hostthis e2e PR #"))] | {count: length, bytes: (map(.size_bytes) | add // 0)})}' <<<"$list")"
            exit 1
          fi

          targets=()
          total=0
          for s in "${del[@]}"; do
            row=$(jq -c --arg s "$s" '.[] | select(.slug==$s)' <<<"$list")
            if [ -z "$row" ]; then
              echo "absent (already gone): $s"
              continue
            fi
            bytes=$(jq -r '.size_bytes' <<<"$row")
            total=$((total + bytes))
            targets+=("$s")
            echo "target $s $(jq -r '[.name, .size_bytes] | @tsv' <<<"$row")"
          done
          for s in "${keep[@]}"; do
            jq -e --arg s "$s" 'any(.[]; .slug==$s)' <<<"$list" >/dev/null || echo "keep not found: $s"
          done
          echo "${#targets[@]} to delete, $total bytes; keeping ${#keep[@]} (never touched)"

          if [ "$DRY_RUN" = "true" ]; then
            echo "dry run: nothing deleted"
            exit 0
          fi

          for s in "${targets[@]}"; do
            echo "deleting $s"
            hh hostthis.dev delete "$s"
          done

          after=$(hh hostthis.dev whoami -o json)
          echo "after: $(reading "$after")"
          rest=$(hh hostthis.dev list -o json)
          for s in "${keep[@]}"; do
            jq -e --arg s "$s" 'any(.[]; .slug==$s)' <<<"$rest" >/dev/null || { echo "KEPT SITE MISSING: $s"; exit 1; }
          done
          for s in "${targets[@]}"; do
            ! jq -e --arg s "$s" 'any(.[]; .slug==$s)' <<<"$rest" >/dev/null || { echo "STILL PRESENT: $s"; exit 1; }
          done
          echo "done: ${#targets[@]} deleted, ${#keep[@]} kept intact"
